<VirtualHost *:80>
    ServerName taskflow.local
    DocumentRoot /var/www/taskflow/dist

    <Directory /var/www/taskflow/dist>
        Require all granted
    </Directory>

    <Directory /var/www/taskflow/dist/admin>
        AuthType Basic
        AuthName "Zona admin de TaskFlow"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/taskflow_error.log
    CustomLog ${APACHE_LOG_DIR}/taskflow_access.log combined
</VirtualHost>
